<html>
<body>
<center>
<button type="button" onclick="colorchange()">change backround color</button>
</center>
<script>
var color=["skyblue","black","blue","yellow","red","magenta"];
var l=color.length;
var i=0;
function colorchange()
{
document.getElementsByTagName("body")[0].style.backgroundColor=color[i];
i = (i+1) % l;
}
</script>
</body>
</html>
