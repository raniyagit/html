<html>
<head>
<title>Mouse Over</title>
</head>
<body>
<h1 id="text">Hello world</h1>
<img src="nature.jpeg"
width="300"
height="200"
onmouseover="onmouse()"
onmouseout="outmouse()"
id="image">
<script>
function onmouse() {
document.getElementById('text').innerText = 'Welcome to my page';
document.getElementById('image').src = 'cse.jpeg';
}
function outmouse() {
document.getElementById('text').innerText = 'Hello world';
document.getElementById('image').src ='images.jpeg';
}
</script>
</body>
</html>
