<html>
<head>
<title>form</title>
</head>
<body bgcolor="beige">
<center>
<h2>registration form</h2>
<form action="#"method="post">
<label for="name">name:</label>
<input type="text" id="name" name="name"><br><br>
<label for="email">email:</label>
<input type="email" id="email" name="email"><br><br>
<label for="phone">phone no:</label>
<input type="tel" id="phone" name="phone"><br><br>
<label for="password">password:</label>
<input type="password" id="password" name="password"><br><br>
<label for="address">address:</label>
<textarea id=address" name="address" rows="4" cols="30"></textarea><br><br>
<label for="qua">qualification:</label>
<select id="qua" name="qua">
<option value="SSLC">SSLC</option>
<option value="p2">PLUS TWO</option>
<option value="ug">UG</option>
<option value="pg">PG</option></select><br><br>
<label>gender:</label>
<input type="radio" id="male" name="gender" value="male">
<label for="male">male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">female</label><br><br>
<label>interests: </label>
<input type="checkbox" id="sports" name="interests" value="sports">
<label for="sports">sports</label>
<input type="checkbox" id="travel" name="interests" value="travel">
<label for="travel">travel</label>
<input type="checkbox" id="music" name="interests" value="music">
<label for="travel">music</label><br><br>
<input type="submit" value="submit">
<input type="reset" value="reset">
</form>
</center>
</body>
</html>
